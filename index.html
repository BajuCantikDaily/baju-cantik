<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baju Cantik Daily – Link in Bio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:  #1E2A20;
      --moss:    #6B7A5A;
      --sage:    #A3A98B;
      --beige:   #F7DECB;
      --ivory:   #F6F3EC;
      --linen:   #D6C7AE;
      --mocha:   #7B5E4B;
      --stone:   #4A4A4A;
      --dark-bg: #1E2A20;
      --dark-surface: rgba(255,255,255,0.06);
      --dark-border: rgba(214,199,174,0.18);
      --dark-card: rgba(255,255,255,0.05);
    }

    body {
      min-height: 100vh;
      background-color: var(--dark-bg);
      background-image:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(107,122,90,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 85% 90%, rgba(123,94,75,0.20) 0%, transparent 50%),
        radial-gradient(ellipse 40% 60% at 50% 50%, rgba(30,42,32,0.6) 0%, transparent 70%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 64px;
      font-family: 'Inter', sans-serif;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Avatar / Logo circle ── */
    .avatar-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #D6C7AE, #A3A98B, #6B7A5A);
      margin-bottom: 18px;
      animation: fadeUp 0.7s ease both;
      flex-shrink: 0;
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--forest);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-inner img {
      width: 200%;
      height: auto;
      object-fit: contain;
      object-position: center center;
    }

    /* Brand name */
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--ivory);
      letter-spacing: -0.3px;
      margin-bottom: 5px;
      animation: fadeUp 0.75s ease both;
      animation-delay: 0.05s;
    }

    /* Tagline */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--linen);
      letter-spacing: 0.5px;
      margin-bottom: 28px;
      opacity: 0.85;
      animation: fadeUp 0.75s ease both;
      animation-delay: 0.1s;
    }

    /* Decorative divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      width: 200px;
      animation: fadeUp 0.75s ease both;
      animation-delay: 0.15s;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(214,199,174,0.4), transparent);
    }
    .divider-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--sage);
      opacity: 0.7;
    }

    /* Links container */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* Link button base */
    .link-btn {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      text-decoration: none;
      border-radius: 14px;
      border: 1px solid var(--dark-border);
      background: var(--dark-card);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.7s ease both;
    }
    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(163,169,139,0.07), rgba(214,199,174,0.05));
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .link-btn:nth-child(1) { animation-delay: 0.2s; }
    .link-btn:nth-child(2) { animation-delay: 0.3s; }
    .link-btn:nth-child(3) { animation-delay: 0.4s; }
    .link-btn:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.09);
      border-color: rgba(214,199,174,0.35);
    }
    .link-btn:hover::before { opacity: 1; }
    .link-btn:active { transform: scale(0.98) translateY(0); }

    .icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-wrap svg {
      width: 21px;
      height: 21px;
    }

    /* WhatsApp */
    .btn-wa .icon-wrap { background: rgba(37,211,102,0.15); }
    .btn-wa .icon-wrap svg { fill: #4ade80; }

    /* TikTok */
    .btn-tt .icon-wrap { background: rgba(255,255,255,0.10); }
    .btn-tt .icon-wrap svg { fill: #f1f1f1; }

    /* Instagram */
    .btn-ig .icon-wrap { background: rgba(253,200,69,0.10); }

    .btn-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .btn-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ivory);
      letter-spacing: 0.2px;
      line-height: 1.2;
    }
    .btn-sub {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 300;
      color: var(--sage);
      margin-top: 2px;
      letter-spacing: 0.2px;
    }
    .btn-arrow {
      font-size: 18px;
      color: rgba(214,199,174,0.4);
      flex-shrink: 0;
    }

    /* Bottom footer */
    .footer {
      margin-top: 36px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: rgba(163,169,139,0.6);
      letter-spacing: 1.5px;
      animation: fadeUp 0.7s ease both;
      animation-delay: 0.55s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
